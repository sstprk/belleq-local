[project]
name = "belleq-lab"
version = "0.1.0"
description = "Belleq retrieval across independent lab nodes"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0", "httpx==0.28.1", "pydantic==2.10.6", "python-multipart==0.0.20", "pypdf==5.1.0", "python-docx==1.1.2", "beautifulsoup4==4.12.3"]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "qdrant-client==1.13.3"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
