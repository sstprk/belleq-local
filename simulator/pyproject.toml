[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belleq-simulator"
version = "0.3.0"
requires-python = ">=3.11"
description = "Evidence-aware distributed retrieval simulator and research archive"
dependencies = ["numpy==2.3.5", "matplotlib==3.10.7"]

[project.scripts]
belleq-sim = "belleq_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
